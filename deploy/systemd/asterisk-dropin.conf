# Installed as /etc/systemd/system/asterisk.service.d/chaarteeke.conf (a drop-in: the package's own
# asterisk.service stays as it is). Missed calls are lost while Asterisk is down, so it is restarted after a
# failure; the Ubuntu 24.04 package already says Restart=on-failure with RestartSec=1, this sets the wait to 5 s.
[Service]
Restart=on-failure
RestartSec=5
ProtectHome=yes
# Asterisk here talks only to the app (ARI) and to a local softphone, both on 127.0.0.1, and to the dongle over
# serial ports. The Ubuntu 24.04 package still opens two UDP sockets on every address, on random ports (found with
# a debugger: pjproject's DNS resolver, created inside res_pjsip, which cannot be unloaded). So the kernel drops
# every packet to or from an address that is not loopback. A SIP trunk or any outside peer would need an
# IPAddressAllow= line here first.
IPAddressDeny=any
IPAddressAllow=localhost
