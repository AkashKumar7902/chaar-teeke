; TEST-ONLY dialplan. Lets the adapter be exercised against a REAL Asterisk with no dongle and no
; softphone, using Local channels as the "network". Never ship this file to the pilot box.
; Include it from the test copy of extensions.conf:   #include extensions_test.conf

; A patient's missed call arriving: caller ID set, then the same hand-off the dongle context uses.
[ct-sim-in]
exten => miss,1,Set(CALLERID(num)=+919999900001)
 same => n,Goto(missed,start,1)

; Same, but with a withheld number (CLIR).
[ct-sim-in-withheld]
exten => miss,1,Set(CALLERID(num)=)
 same => n,Set(CALLERID(name)=)
 same => n,Goto(missed,start,1)

; The far end of an outbound call: the "patient's phone". Picks up, presses 1, later presses #
; to end the spoken-answer recording, then hangs up.
[ct-sim-patient]
exten => s,1,Answer()
 same => n,Wait(2)
 same => n,SendDTMF(1)
 same => n,Wait(6)
 same => n,SendDTMF(#)
 same => n,Wait(4)
 same => n,Hangup()

; A phone that rejects the call (busy).
[ct-sim-busy]
exten => s,1,Busy(5)
