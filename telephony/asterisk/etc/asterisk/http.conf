; Chaar Teeke - Asterisk built-in HTTP server (carries ARI REST + WebSocket).
; Loopback only: the FastAPI app runs on the same box. Never expose 8088 to a network.
[general]
enabled=yes
bindaddr=127.0.0.1
bindport=8088
; TLS is not needed on loopback. If the app ever runs on another host, put a TLS reverse
; proxy or an SSH tunnel in front instead of binding 0.0.0.0.
