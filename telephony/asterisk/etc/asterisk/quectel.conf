; Chaar Teeke - chan_quectel for ONE SIMCom SIM7600G-H dongle (Waveshare), TTY audio mode.
; Written for the RoEdAl fork (archived Sep 2024, last release v2023.12.13) and forks of it.
; UNVERIFIED on real hardware: see TELEPHONY.md "Only verifiable once the dongle is bought".
;
; SIM7600G-H USB layout with default PID 1e0e:9001, as seen by the Linux "option" driver:
;   ttyUSB0 diag   ttyUSB1 NMEA   ttyUSB2 AT   ttyUSB3 modem   ttyUSB4 PCM audio
; Use the udev symlinks from ../udev/rules.d/99-sim7600.rules so a re-plug cannot swap ports.
; The RoEdAl wiki states this module works in TTY mode only (not UAC/ALSA).

[general]
interval=15                       ; seconds between reconnect attempts if the dongle drops
smsdb=:memory:

[defaults]
context=quectel-incoming          ; incoming calls start here (extensions.conf)
group=0
language=hi
multiparty=no
callwaiting=no                    ; a second incoming call while one is active is ignored
dtmf=on                           ; DTMF detected inside the module (AT+DDET); MUST be tested
dtmf_duration=200                 ; ms for DTMF we send; irrelevant to the IVR
slin16=on                         ; 16 kHz audio, SIM7600 only
resetmodem=yes
autodeletesms=yes
query_time=no
qhup=on
initstate=start
; Audio gain is hardware dependent. The RoEdAl wiki (issue 18) warns that setting all gains to 0
; makes TX sound blown out. Start at the values below, then tune by listening:
;   AT+COUTGAIN=8   AT+CMICGAIN=3   AT+CECM=0
; Send them once via:  asterisk -rx "quectel cmd sim7600-0 AT+COUTGAIN=8"
; rxgain/txgain are left at -1 (module setting).
rxgain=-1
txgain=-1

[sim7600-0]
data=/dev/sim7600-at              ; udev symlink -> ttyUSB2
audio=/dev/sim7600-audio          ; udev symlink -> ttyUSB4
; imei/imsi keys were removed in this fork; address the device by name: Quectel/sim7600-0/<number>
; "exten" is used only when the SIM does not store its own number:
;exten=s
