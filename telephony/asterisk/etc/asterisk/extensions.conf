; Chaar Teeke - dialplan. Deliberately tiny: ALL IVR logic lives in the Python app, driven over ARI.
; The dialplan only hands calls to the Stasis application "chaar".

[general]
static=yes
writeprotect=no

; ---------------------------------------------------------------------------------------------
; Calls arriving on the SIM7600 dongle (context named in quectel.conf). This is the missed-call
; entry point: the patient rings the clinic number, we never answer, we only read the caller ID.
; chan_quectel delivers incoming calls to exten "s" (or to the SIM's own number if the SIM stores it).
; ---------------------------------------------------------------------------------------------
[quectel-incoming]
exten => s,1,Goto(missed,start,1)
exten => _X.,1,Goto(missed,start,1)
exten => _+X.,1,Goto(missed,start,1)
; SMS / USSD / reports from chan_quectel arrive here as exten sms / ussd / report. We use none of
; them; hang up so they are not left dangling.
exten => sms,1,Hangup()
exten => ussd,1,Hangup()
exten => report,1,Hangup()

; Same hand-off for the SIP test endpoint: dial 100 from the softphone to play "patient gives a
; missed call". Nothing else can be dialled from it (inbound IVR is not part of the product).
[from-softphone]
exten => 100,1,Goto(missed,start,1)

; Provider trunk (pilot): the DID that carries missed calls lands here once a trunk exists.
[from-provider]
exten => _X.,1,Goto(missed,start,1)
exten => _+X.,1,Goto(missed,start,1)

[missed]
; No Answer() anywhere: an unanswered call costs the patient nothing. The ARI app reads
; channel.caller.number from the StasisStart event and rejects the call itself.
exten => start,1,NoOp(missed call entering Stasis - number deliberately not logged)
 same => n,Stasis(chaar,incoming)
; Stasis() only returns here if the app is not connected or the channel was already gone.
; This is loud on purpose: the call is lost, and the operator must see it (the number is never logged). No spool file,
; no auto-callback, no second route (see TELEPHONY.md, open question 6).
 same => n,Log(ERROR,ARI app chaar not running: a missed call was NOT recorded)
 same => n,Hangup(21)
