; Chaar Teeke - load only what is needed (keeps RAM small on an 8 GB Mac or a Pi).
[modules]
autoload=yes
noload => chan_alsa.so
noload => chan_console.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
; Privacy: no call detail records (CDR) and no channel event log (CEL), because both hold the caller's number.
; modules.conf cannot noload by wildcard, so each record module is named. cdr.conf and cel.conf say enable=no too.
noload => cdr_csv.so
noload => cdr_custom.so
noload => cdr_manager.so
noload => cdr_sqlite3_custom.so
noload => cel_custom.so
noload => cel_manager.so
noload => cel_sqlite3_custom.so
; Asterisk 22 folded the custom CDR and CEL writers into one module. It writes only what cdr_custom.conf and
; cel_custom.conf map, but this keeps the promise by name rather than by an empty sample file.
noload => res_cdrel_custom.so
; The Debian and Ubuntu package (Asterisk 20) also loads database and RADIUS backends for the same records
; (found with 'module show like cdr' on Ubuntu 24.04). With nothing configured they write nowhere, but they are
; loaded and ready, so they are named here too.
noload => cdr_adaptive_odbc.so
noload => cdr_odbc.so
noload => cdr_pgsql.so
noload => cdr_radius.so
noload => cdr_tds.so
noload => cel_odbc.so
noload => cel_pgsql.so
noload => cel_radius.so
noload => cel_tds.so
; Nothing here uses these three, and each opens a UDP port on every network address of the box (found by
; listing the open sockets of a running Asterisk): IAX2 4569, UniStim 5000, DUNDi 4520. SIP binds loopback only.
noload => chan_iax2.so
noload => chan_unistim.so
noload => pbx_dundi.so
; The old SIP channel driver ships in the Debian and Ubuntu package and binds UDP 5060 on every address. It lost
; that port to res_pjsip (127.0.0.1:5060) on the Ubuntu 24.04 test only because of the order the modules load in.
; Nothing here uses it.
noload => chan_sip.so
; chan_quectel.so is a separate build (see TELEPHONY.md) and loads from the same directory.
; On a Mac without the dongle it is simply absent: SIP-only mode.
