; Privacy: patient phone numbers appear in Asterisk verbose/debug output (CLIP lines, channel names).
; Keep verbose and debug OFF in files; logrotate (telephony/asterisk/etc/logrotate.d/asterisk) keeps 7 days.
[general]
; logrotate renames the files and asks Asterisk to reopen them (logger reload); Asterisk does not rotate itself
rotatestrategy = none
[logfiles]
console => notice,warning,error
messages.log => notice,warning,error
