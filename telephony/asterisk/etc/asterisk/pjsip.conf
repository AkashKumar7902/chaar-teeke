; Chaar Teeke - SIP side. Two uses:
;   1. "softphone" endpoint: lets Linphone / baresip on the same machine stand in for a patient's
;      phone, so the whole call flow can be tested with no dongle (mode: sip-test).
;   2. "provider-trunk" (commented out): the pilot path through a licensed cloud-telephony or
;      government-approved provider. The ARI adapter does not change; only endpoint_template does.
; Everything binds to loopback.

[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:5060

; ---------------------------------------------------------------- softphone (test only)
[softphone]
type=endpoint
transport=transport-udp
context=from-softphone
disallow=all
allow=ulaw,alaw,slin16
auth=softphone-auth
aors=softphone
direct_media=no
rtp_symmetric=yes
force_rport=yes
callerid="Test Patient" <+919999900001>
dtmf_mode=rfc4733

[softphone-auth]
type=auth
auth_type=userpass
username=softphone
password=dev-only-softphone

[softphone]
type=aor
max_contacts=1
remove_existing=yes
; Static contact so ARI originate to "PJSIP/softphone" rings baresip without REGISTER:
; contact=sip:softphone@127.0.0.1:5070

; ------------------------------------------------------- licensed provider trunk (pilot)
;[provider-trunk]
;type=endpoint
;transport=transport-udp          ; use a TLS/UDP transport on a public bind in the pilot
;context=from-provider
;disallow=all
;allow=ulaw,alaw
;outbound_auth=provider-auth
;aors=provider-aor
;dtmf_mode=rfc4733
;
;[provider-auth]
;type=auth
;auth_type=userpass
;username=FILL-FROM-PROVIDER
;password=FILL-FROM-PROVIDER
;
;[provider-aor]
;type=aor
;contact=sip:FILL-PROVIDER-HOST:5060
;
;[provider-reg]
;type=registration
;outbound_auth=provider-auth
;server_uri=sip:FILL-PROVIDER-HOST
;client_uri=sip:FILL-USER@FILL-PROVIDER-HOST
;
;[provider-id]
;type=identify
;endpoint=provider-trunk
;match=FILL-PROVIDER-IP
