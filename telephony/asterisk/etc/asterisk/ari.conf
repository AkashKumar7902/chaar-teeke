; Chaar Teeke - Asterisk REST Interface. App name "chaar" is the Stasis application.
[general]
enabled=yes
pretty=yes                       ; readable JSON while developing; set no in the pilot
allowed_origins=                 ; no browser access
websocket_write_timeout=100

[chaar]
type=user
read_only=no
; Replace before any use outside a laptop. Generate a hash with:  openssl passwd -6 'secret'
; then set password_format=crypt and paste the hash.
password_format=plain
password=CHANGE-ME-dev-only
